<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a34"/>
      <stop offset="100%" stop-color="#052016"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Base Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#greenGrad)" stroke="#ff9933" stroke-width="12"/>
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#fde047" stroke-width="4" stroke-dasharray="8 6"/>
  
  <!-- Wheat / Kalash / Village Symbolism -->
  <!-- Central Sun / Energy Rays -->
  <circle cx="256" cy="220" r="65" fill="url(#saffron)" opacity="0.9"/>
  <circle cx="256" cy="220" r="45" fill="url(#goldGrad)"/>
  
  <!-- Wheat Stalks (Left & Right) -->
  <path d="M 256 420 C 230 360 170 310 130 220 C 160 225 180 250 190 280 C 195 240 220 220 256 220 C 292 220 317 240 322 280 C 332 250 352 225 382 220 C 342 310 282 360 256 420 Z" fill="url(#goldGrad)" opacity="0.95"/>
  
  <!-- Spikes of Wheat Left -->
  <ellipse cx="160" cy="240" rx="20" ry="10" transform="rotate(-35 160 240)" fill="#fde047"/>
  <ellipse cx="180" cy="200" rx="22" ry="11" transform="rotate(-45 180 200)" fill="#fde047"/>
  <ellipse cx="210" cy="170" rx="20" ry="10" transform="rotate(-55 210 170)" fill="#fde047"/>
  
  <!-- Spikes of Wheat Right -->
  <ellipse cx="352" cy="240" rx="20" ry="10" transform="rotate(35 352 240)" fill="#fde047"/>
  <ellipse cx="332" cy="200" rx="22" ry="11" transform="rotate(45 332 200)" fill="#fde047"/>
  <ellipse cx="302" cy="170" rx="20" ry="10" transform="rotate(55 302 170)" fill="#fde047"/>

  <!-- Top Center Star / Spire -->
  <polygon points="256,120 263,142 286,142 268,156 275,178 256,164 237,178 244,156 226,142 249,142" fill="#ffffff"/>

  <!-- Base Ribbon -->
  <path d="M 120 400 Q 256 450 392 400 L 372 440 Q 256 470 140 440 Z" fill="#ff9933"/>
  <text x="256" y="432" font-family="'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">ग्राम पंचायत</text>
</svg>
